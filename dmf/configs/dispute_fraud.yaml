# =============================================================================
# Debit-card dispute fraud -- champion / challenger specification search
# =============================================================================
# Every input the framework needs lives in this file. Nothing about the dataset
# is hard-coded in the package: point `data.path` and `columns.*` at another
# table and the same harness runs unchanged.
# =============================================================================

run:
  name: dispute_fraud_v1
  output_dir: ./artifacts
  random_state: 42
  n_jobs: 2                 # parallelism for cross_validate; keep estimator n_jobs at 1
  verbose: 1
  save_fitted_model: true
  refit_on_full_data: true  # ship a model fit on train + holdout

data:
  path: ./data/disputes.csv
  format: csv
  target: is_fraudulent_dispute
  positive_label: 1
  sample_frac: null

columns:
  # Leave both lists empty and set auto_infer: true to let the framework type
  # the columns itself -- useful on a new dataset, explicit is better in prod.
  numeric:
    - dispute_amount
    - txn_amount
    - amount_to_daily_spend_ratio
    - days_txn_to_dispute
    - cardholder_tenure_months
    - cardholder_tenure_years          # collinear with the above, on purpose
    - prior_disputes_12m
    - prior_disputes_lifetime
    - prior_dispute_upheld_ratio
    - avg_monthly_spend
    - spend_decile
    - txn_count_30d
    - distinct_merchants_30d
    - night_txn_share_30d
    - card_present_share_30d
    - days_since_address_change
    - days_since_card_reissue
    - failed_logins_7d
    - device_changes_90d
    - geo_distance_km
    - txn_hour
    - internal_risk_score
    - noise_gaussian                   # pure noise; selection should reject it
    - noise_uniform
    - noise_gamma
  categorical:
    - merchant_id                      # ~220 levels; exercises rare collapsing
    - merchant_category
    - channel
    - claim_channel
    - device_type
    - region
    - customer_segment
    - dispute_reason_code
  passthrough: []
  drop:
    - dispute_id
  auto_infer: false                    # true -> type any undeclared column automatically
  auto_infer_max_cardinality: 25
  # a text column whose values parse at this rate is read as numeric or as a
  # date rather than becoming a high-cardinality categorical
  numeric_parse_threshold: 0.95
  # quality gates, applied only to columns the framework picks for itself
  drop_constant: true
  max_categorical_cardinality_ratio: 0.5

preprocessing:
  numeric:
    imputer: median
    add_missing_indicator: true        # missingness is itself informative in disputes
    winsorize:
      enabled: true
      lower_quantile: 0.005
      upper_quantile: 0.995
    scaler: standard                   # auto-disabled for models with requires_scaling: false
    variance_threshold: null
  categorical:
    imputer: constant
    imputer_fill_value: __MISSING__
    rare_level:
      enabled: true
      min_frequency: 0.005
      other_label: __RARE__
    encoder: onehot                    # onehot | ordinal | woe | target
    onehot:
      handle_unknown: infrequent_if_exist
      max_categories: null
      drop_first: false
    woe:
      smoothing: 0.5
      clip: 4.0
    target:
      cv: 5
      smooth: auto

  # -- inference-time safety -------------------------------------------------
  # Governs what happens when production sends a category level or a numeric
  # value the training data never contained. Defaults never extrapolate, never
  # raise, and always flag the affected rows for manual review.
  inference_guard:
    enabled: true
    numeric_policy: clip               # clip | nan | passthrough | error
    numeric_tolerance: 0.0             # 0.0 = clip to the exact training range
    coerce_numeric: true               # text in a numeric column -> missing, flagged
    unseen_category_policy: sentinel   # sentinel | nan | error
    unseen_label: __UNSEEN__
    missing_column_policy: fill        # fill = treat as missing and impute, flagged
    max_guarded_rate: 0.05             # batch marked 'review_recommended' above this
    warn: true

split:
  holdout_size: 0.2
  stratify: true
  # random -- i.i.d. rows.
  # group  -- keep every dispute from one cardholder on a single side of every
  #           split. Use this the moment a customer can appear more than once.
  # time   -- holdout is the most recent slice and folds run forward only; the
  #           honest test for a model that will score next month's disputes.
  strategy: random                     # random | group | time
  group_column: null                   # e.g. customer_id  (required for 'group')
  time_column: null                    # e.g. dispute_opened_at (required for 'time')
  cv:
    n_splits: 5
    n_repeats: 1                       # >1 switches to RepeatedStratifiedKFold
    shuffle: true

metrics:
  primary: average_precision           # PR-AUC: the right primary under low prevalence
  secondary:
    - roc_auc
    - ks_statistic
    - recall_at_fpr
    - lift_at_top_pct
    - brier_score
  recall_at_fpr: 0.01                  # detection rate at a 1% false-positive budget
  lift_top_pct: 0.05                   # analyst review capacity = top 5% of volume
  compute_train_scores: true           # enables the overfit-gap diagnostic
  # holdout report broken down by these columns -- they need only exist in the
  # data, not be model inputs, so flag-rate parity can be checked on attributes
  # the model is deliberately not allowed to use (Reg E / fair-treatment review)
  slice_columns:
    - claim_channel
    - dispute_reason_code
    - customer_segment
    - channel
  min_slice_n: 50

selection:
  ordering_strategy: importance        # importance | rfe
  ordering_reference_model: per_model  # 'per_model' or a single model key
  importance:
    method: auto                       # auto | coef | gain | permutation
    permutation_repeats: 5
  rfe:
    step: 1
    aggregate: min_rank
  k_min: 1
  k_max: 10
  k_step: 1
  top_n: 3
  # false -> the 3 best (model, k) cells outright, which may all be one model.
  # true  -> the best variant of 3 different architectures, which is usually
  #          what a champion/challenger review wants to see.
  top_n_distinct_models: false
  one_se_rule: true                    # prefer the simplest model within 1 SE of the best
  marginal_gain_test: paired_t         # paired_t (Nadeau-Bengio corrected) | wilcoxon | none

# -----------------------------------------------------------------------------
# Estimator zoo. Add a model by adding a block -- no code change required.
# -----------------------------------------------------------------------------
models:

  logistic_l2:
    enabled: true
    tag: champion
    family: linear
    estimator: sklearn.linear_model.LogisticRegression
    requires_scaling: true
    imbalance: balanced
    params:
      C: 1.0
      solver: lbfgs
      max_iter: 3000

  logistic_woe:
    enabled: true
    tag: champion
    family: linear
    estimator: sklearn.linear_model.LogisticRegression
    requires_scaling: true
    imbalance: balanced
    preprocessing_overrides:
      categorical.encoder: woe         # classic scorecard treatment, IV reported
    params:
      C: 0.5
      solver: lbfgs
      max_iter: 3000

  random_forest:
    enabled: false
    tag: challenger
    family: tree
    estimator: sklearn.ensemble.RandomForestClassifier
    requires_scaling: false
    imbalance: balanced
    params:
      n_estimators: 400
      min_samples_leaf: 20
      max_features: sqrt
      n_jobs: 1

  hist_gbm:
    enabled: false
    tag: challenger
    family: tree
    estimator: sklearn.ensemble.HistGradientBoostingClassifier
    requires_scaling: false
    imbalance: balanced
    params:
      max_iter: 300
      learning_rate: 0.06
      max_leaf_nodes: 31
      min_samples_leaf: 25
      early_stopping: false

  xgboost:
    enabled: true
    tag: challenger
    family: tree
    estimator: xgboost.XGBClassifier
    requires_scaling: false
    imbalance: scale_pos_weight
    preprocessing_overrides:
      categorical.encoder: ordinal     # trees split ordinal codes fine and stay narrow
    params:
      n_estimators: 250
      max_depth: 4
      learning_rate: 0.07
      subsample: 0.9
      colsample_bytree: 0.8
      min_child_weight: 5
      reg_lambda: 1.5
      tree_method: hist
      eval_metric: aucpr
      n_jobs: 1

  lightgbm:
    enabled: true
    tag: challenger
    family: tree
    estimator: lightgbm.LGBMClassifier
    requires_scaling: false
    imbalance: balanced
    preprocessing_overrides:
      categorical.encoder: ordinal
    params:
      n_estimators: 250
      learning_rate: 0.06
      num_leaves: 31
      min_child_samples: 30
      subsample: 0.9
      subsample_freq: 1
      colsample_bytree: 0.8
      verbose: -1
      n_jobs: 1

# -----------------------------------------------------------------------------
# Hyper-parameter tuning is OFF by default. Selection is about *which variables
# and which architecture*; tuning is a separate, later question. When enabled,
# the search runs on an inner CV split and the tuned specification is then
# re-scored on the same outer CV as everything else, so the leaderboard stays
# comparable.
# -----------------------------------------------------------------------------
tuning:
  enabled: false
  strategy: random
  n_iter: 20
  cv_splits: 3
  apply_to: top_n
  search_spaces:
    logistic_l2:
      model__C: [0.01, 0.05, 0.1, 0.5, 1.0, 2.0, 5.0]
    logistic_woe:
      model__C: [0.01, 0.05, 0.1, 0.5, 1.0, 2.0]
    xgboost:
      model__max_depth: [3, 4, 5, 6]
      model__learning_rate: [0.03, 0.05, 0.07, 0.1]
      model__min_child_weight: [1, 5, 10, 20]
      model__reg_lambda: [0.5, 1.0, 2.0, 5.0]
    lightgbm:
      model__num_leaves: [15, 31, 63]
      model__learning_rate: [0.03, 0.06, 0.1]
      model__min_child_samples: [10, 30, 60]
