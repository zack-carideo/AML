# =============================================================================
# Debit-card dispute fraud -- champion / challenger specification search
# =============================================================================
# Every input the framework needs lives in this file. Nothing about the dataset
# is hard-coded in the package: point `data.path` and `columns.*` at another
# table and the same harness runs unchanged.
# =============================================================================

run:
  name: dispute_fraud_v1
  output_dir: ./artifacts
  random_state: 42
  n_jobs: 2                 # parallelism for cross_validate; keep estimator n_jobs at 1
  verbose: 1
  save_fitted_model: true
  refit_on_full_data: true  # ship a model fit on train + holdout
  # row-level prediction store written under the run's artifact directory, so
  # any metric can be recomputed after the run without refitting anything.
  # Levels are cumulative -- each stores everything below it:
  #   none    -- store nothing
  #   holdout -- the champion's holdout predictions (cheap; the default)
  #   cv      -- + every validation-fold prediction of every model x k cell
  #   all     -- + the training-side predictions of each CV fold (largest;
  #              enables row-level overfit diagnostics)
  # Row count scales with models x k values x folds, so cv/all grow fast.
  save_predictions: holdout

data:
  path: ./data/disputes.csv
  format: csv
  target: is_fraudulent_dispute
  # column that uniquely identifies a record (dispute id, claim id, ...). It
  # keys the row-level prediction store and is NEVER used as a model feature.
  # null -> the DataFrame index is recorded instead.
  id_column: null
  positive_label: 1
  sample_frac: null
  read_kwargs: {}                      # extra kwargs handed to the pandas reader

columns:
  # Leave both lists empty and set auto_infer: true to let the framework type
  # the columns itself -- useful on a new dataset, explicit is better in prod.
  numeric:
    - dispute_amount
    - txn_amount
    - amount_to_daily_spend_ratio
    - days_txn_to_dispute
    - cardholder_tenure_months
    - cardholder_tenure_years          # collinear with the above, on purpose
    - prior_disputes_12m
    - prior_disputes_lifetime
    - prior_dispute_upheld_ratio
    - avg_monthly_spend
    - spend_decile
    - txn_count_30d
    - distinct_merchants_30d
    - night_txn_share_30d
    - card_present_share_30d
    - days_since_address_change
    - days_since_card_reissue
    - failed_logins_7d
    - device_changes_90d
    - geo_distance_km
    - txn_hour
    - internal_risk_score
    - noise_gaussian                   # pure noise; selection should reject it
    - noise_uniform
    - noise_gamma
  categorical:
    - merchant_id                      # ~220 levels; exercises rare collapsing
    - merchant_category
    - channel
    - claim_channel
    - device_type
    - region
    - customer_segment
    - dispute_reason_code
  passthrough: []
  drop:
    - dispute_id

  # AUTO_INFER SCOPE OVERVIEW   
  # true -> type any undeclared column automatically 
  # all columns are considered if this = True. columns in columns.drop are still ignored
  # group_column and time_column are never considered as candidates). 
  # candidates columns still go through 4 filters: quality gate(100% null, constant, 
  # or identifier like with unique values above max_categorical_cardinality_ratio are removed 
  # with reason reported). Note: auto-inference only types the UNDECLARED remainder of 
  # columns so the columns you declare explicitly as numeric/categoric, are not overwritten.
  auto_infer: false              

  # Integer coded columns with unique values below this threshold are read as categorical 
  # rather than numeric (since arithmetic on coded values is usually meaningless).      
  # a text column whose values parse at this rate is read as numeric or as a
  # date rather than becoming a high-cardinality categorical
  auto_infer_max_cardinality: 25 

  # share of a text column's non-null values that must parse cleanly as numbers 
  # or dates for auto-inference to treat it as numeric/datetime instead of categorical
  numeric_parse_threshold: 0.95
  
  # quality gates, applied only to columns the framework picks for itself
  drop_constant: true

  # Categorical columns with unique values above this ratio are dropped
  # Exception: if the column is explicitly declared in columns.categorical, it is kept
  # regardless of cardinality, and high cardinality is then handled by the rare-level collapsing into __RARE__ instead of dropping
  # NOTE: __rare__ just clumps all rare levels into one level, but does not consider the relationship between the rare levels and the target variable. If you want to do that, use target encoding instead of one-hot encoding.
  max_categorical_cardinality_ratio: 0.5 

preprocessing:
  numeric:
    imputer: median                    # numeric imputation for missing values. if you use anything other than CONSTANT, then make sure add_missing_indicator = True, so that we can identify which records were imputed, and the model also has this available during training.
    imputer_fill_value: 0.0            # only consulted when imputer: constant
    add_missing_indicator: true        # missingness is itself informative in disputes. if True, appends a binary missingindicator_<col> column for each numeric that had missing values in training. 
    winsorize:                         # established during training, training thresholds used during inference
      enabled: true
      lower_quantile: 0.005
      upper_quantile: 0.995
    scaler: standard                   # auto-disabled for models with requires_scaling: false ,  only logistic actually needs scaling, but it is a good idea to keep the numeric features on a similar scale for tree-based models as well.
    variance_threshold: null           # optional last step in numeric branch that drops encoded columlns whose training_variance < threshold. it operates AFTER encoding, per fold -where new newar-constants appear that role inference cant see (e.g a missing indicator thats 99% 0, or a column that happens to be constant within one CV fold training split). Do not use in production, only use if absolutly required during model selection to reduce dimensionality. If you use this, make sure to set the threshold low enough that you dont drop any columns that are actually informative.
  categorical:
    imputer: constant                  # leave this, ensures information from missing is captured during WOE binning. if set to most_frequent all missing values are merged into the marjority level, highly likley to create noise. NOTE on Ordering: imputation runs before rarae-level collapsing  
    imputer_fill_value: __MISSING__
    rare_level:
      enabled: true
      min_frequency: 0.005
      other_label: __RARE__
    encoder: onehot                    # onehot | ordinal | woe | target  NOTE: run the framework over multiple config setups to evalute differnt approaches
    onehot:
      handle_unknown: infrequent_if_exist
      max_categories: null
      drop_first: false
    woe:
      smoothing: 0.5
      clip: 4.0
      report_iv: true                  # report information value per categorical
    target:
      cv: 5
      smooth: auto

  # -- inference-time safety -------------------------------------------------
  # Governs what happens when production sends a category level or a numeric
  # value the training data never contained. Defaults never extrapolate, never
  # raise, and always flag the affected rows for manual review.
  inference_guard:
    enabled: true
    numeric_policy: clip               # clip | nan | passthrough | error
    numeric_tolerance: 0.0             # 0.0 = clip to the exact training range
    coerce_numeric: true               # text in a numeric column -> missing, flagged
    unseen_category_policy: sentinel   # sentinel | nan | error
    unseen_label: __UNSEEN__
    missing_column_policy: fill        # fill = treat as missing and impute, flagged , set to error to hard fail if a column  used for inferencing is missing (NOTE: if a column is present but is all NULL, it will not fail, it will fill with training median, and flag all rows as missing the value, use post-scoring reporting to account for)
    max_guarded_rate: 0.05             # batch marked 'review_recommended' above this
    warn: true

split:
  holdout_size: 0.2
  stratify: true
  # random -- i.i.d. rows.
  # group  -- keep every dispute from one cardholder on a single side of every
  #           split. Use this the moment a customer can appear more than once.
  # time   -- holdout is the most recent slice and folds run forward only; the
  #           honest test for a model that will score next month's disputes.
  strategy: random                     # random | group | time
  group_column: null                   # e.g. customer_id  (required for 'group')
  time_column: null                    # e.g. dispute_opened_at (required for 'time')
  cv:
    n_splits: 5
    n_repeats: 1                       # >1 switches to RepeatedStratifiedKFold
    shuffle: true

metrics:
  primary: average_precision           # PR-AUC: the right primary under low prevalence
  secondary:
    - roc_auc
    - ks_statistic
    - recall_at_fpr
    - lift_at_top_pct
    - brier_score
  recall_at_fpr: 0.01                  # detection rate at a 1% false-positive budget
  lift_top_pct: 0.05                   # analyst review capacity = top 5% of volume
  compute_train_scores: true           # enables the overfit-gap diagnostic
  # how the champion's production decision threshold is derived from its
  # holdout score distribution. It ships inside the model bundle so
  # ProductionScorer applies a stable absolute cut rather than a
  # batch-relative quantile:
  #   top_pct -- the cut that flags the top lift_top_pct of holdout volume
  #   fpr     -- the cut that achieves the recall_at_fpr false-positive rate
  #   none    -- do not derive one; the bundle ships decision_threshold: null
  # With a list of budgets configured above, the FIRST value is used.
  decision_threshold_policy: top_pct
  # holdout report broken down by these columns -- they need only exist in the
  # data, not be model inputs, so flag-rate parity can be checked on attributes
  # the model is deliberately not allowed to use (Reg E / fair-treatment review)
  slice_columns:
    - claim_channel
    - dispute_reason_code
    - customer_segment
    - channel
  min_slice_n: 50

selection:
  ordering_strategy: importance        # importance | rfe
  ordering_reference_model: per_model  # 'per_model' or a single model key
  importance:
    method: auto                       # auto | coef | gain | permutation
    permutation_repeats: 5
    # multiply each coefficient by the SD of its encoded column before rolling
    # up to the source variable. Without it, summing |coef| across the levels
    # of a high-cardinality categorical mechanically outranks a strong numeric.
    scale_by_std: true
    aggregate: sum                     # sum | max | mean  (encoded -> source)
  rfe:
    step: 1
    aggregate: min_rank
  k_min: 1
  k_max: 10
  k_step: 1
  top_n: 3
  # false -> the 3 best (model, k) cells outright, which may all be one model.
  # true  -> the best variant of 3 different architectures, which is usually
  #          what a champion/challenger review wants to see.
  top_n_distinct_models: true
  one_se_rule: true                    # prefer the simplest model within 1 SE of the best
  marginal_gain_test: paired_t         # paired_t (Nadeau-Bengio corrected) | wilcoxon | none

# -----------------------------------------------------------------------------
# Estimator zoo. Add a model by adding a block -- no code change required.
# -----------------------------------------------------------------------------
models:

  logistic_l2:
    enabled: true
    tag: champion
    family: linear
    estimator: sklearn.linear_model.LogisticRegression
    requires_scaling: true
    handles_categorical_natively: false
    imbalance: balanced
    preprocessing_overrides: {}       # dotted preprocessing keys for this model only
    params:
      C: 1.0
      solver: lbfgs
      max_iter: 3000

  logistic_woe:
    enabled: true
    tag: champion
    family: linear
    estimator: sklearn.linear_model.LogisticRegression
    requires_scaling: true
    handles_categorical_natively: false
    imbalance: balanced
    preprocessing_overrides:
      categorical.encoder: woe         # classic scorecard treatment, IV reported
    params:
      C: 0.5
      solver: lbfgs
      max_iter: 3000

  random_forest:
    enabled: false
    tag: challenger
    family: tree
    estimator: sklearn.ensemble.RandomForestClassifier
    requires_scaling: false
    handles_categorical_natively: false
    imbalance: balanced
    preprocessing_overrides: {}       # dotted preprocessing keys for this model only
    params:
      n_estimators: 400
      min_samples_leaf: 20
      max_features: sqrt
      n_jobs: 1

  hist_gbm:
    enabled: false
    tag: challenger
    family: tree
    estimator: sklearn.ensemble.HistGradientBoostingClassifier
    requires_scaling: false
    handles_categorical_natively: false
    imbalance: balanced
    preprocessing_overrides: {}       # dotted preprocessing keys for this model only
    params:
      max_iter: 300
      learning_rate: 0.06
      max_leaf_nodes: 31
      min_samples_leaf: 25
      early_stopping: false

  xgboost:
    enabled: true
    tag: challenger
    family: tree
    estimator: xgboost.XGBClassifier
    requires_scaling: false
    handles_categorical_natively: false
    imbalance: scale_pos_weight
    preprocessing_overrides:
      categorical.encoder: ordinal     # trees split ordinal codes fine and stay narrow
    params:
      n_estimators: 250
      max_depth: 4
      learning_rate: 0.07
      subsample: 0.9
      colsample_bytree: 0.8
      min_child_weight: 5
      reg_lambda: 1.5
      tree_method: hist
      eval_metric: aucpr
      n_jobs: 1

  lightgbm:
    enabled: true
    tag: challenger
    family: tree
    estimator: lightgbm.LGBMClassifier
    requires_scaling: false
    handles_categorical_natively: false
    imbalance: balanced
    preprocessing_overrides:
      categorical.encoder: ordinal
    params:
      n_estimators: 250
      learning_rate: 0.06
      num_leaves: 31
      min_child_samples: 30
      subsample: 0.9
      subsample_freq: 1
      colsample_bytree: 0.8
      verbose: -1
      n_jobs: 1

# -----------------------------------------------------------------------------
# Hyper-parameter tuning is OFF by default. Selection is about *which variables
# and which architecture*; tuning is a separate, later question. When enabled,
# the search runs on an inner CV split and the tuned specification is then
# re-scored on the same outer CV as everything else, so the leaderboard stays
# comparable.
# -----------------------------------------------------------------------------
tuning:
  enabled: false
  strategy: random
  n_iter: 20
  cv_splits: 3
  apply_to: top_n
  search_spaces:
    logistic_l2:
      model__C: [0.01, 0.05, 0.1, 0.5, 1.0, 2.0, 5.0]
    logistic_woe:
      model__C: [0.01, 0.05, 0.1, 0.5, 1.0, 2.0]
    xgboost:
      model__max_depth: [3, 4, 5, 6]
      model__learning_rate: [0.03, 0.05, 0.07, 0.1]
      model__min_child_weight: [1, 5, 10, 20]
      model__reg_lambda: [0.5, 1.0, 2.0, 5.0]
    lightgbm:
      model__num_leaves: [15, 31, 63]
      model__learning_rate: [0.03, 0.06, 0.1]
      model__min_child_samples: [10, 30, 60]
